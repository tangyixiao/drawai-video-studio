name: Distribution checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: npm ci --prefix skills/drawai-video-studio/scripts --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node skills/drawai-video-studio/scripts/wb.mjs --help
      - run: node skills/drawai-video-studio/scripts/wb.mjs card list --json
      - run: node skills/drawai-video-studio/scripts/wb.mjs style list --json
      - run: python tools/package_release.py
