name: Distribution checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: npm ci --prefix skills/drawai-video-studio/scripts --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node skills/drawai-video-studio/scripts/wb.mjs --help
      - run: node skills/drawai-video-studio/scripts/wb.mjs card list --json
      - run: node skills/drawai-video-studio/scripts/wb.mjs style list --json
      - run: python tools/package_release.py
